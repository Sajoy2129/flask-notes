<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Child pages can replace this block with their own title -->
    <title>{% block title %}Flask Notes{% endblock %}</title>
    <!-- url_for("static", ...) builds the URL /static/style.css -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1><a href="{{ url_for('home') }}">Flask Notes</a></h1>
        <nav><a href="{{ url_for('new_note') }}">+ New note</a></nav>
    </header>

    <main>
        <!-- Each child page puts its own content here -->
        {% block content %}{% endblock %}
    </main>
</body>
</html>
