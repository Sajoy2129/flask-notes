{% extends "base.html" %}

{% block title %}All notes · Flask Notes{% endblock %}

{% block content %}
    <h2>All notes</h2>

    {% if notes %}
        <ul>
        {% for note in notes %}
            <li>
                <strong>{{ note.title }}</strong>
                <p>{{ note.body }}</p>
            </li>
        {% endfor %}
        </ul>
    {% else %}
        <p>No notes yet.</p>
    {% endif %}
{% endblock %}
